name: Android APK

# Builds an installable APK on every push to main (or by hand from the Actions tab)
# and attaches it to the "latest" release so testers can download it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk the-rut.apk

      - uses: actions/upload-artifact@v4
        with:
          name: the-rut-apk
          path: the-rut.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest the-rut.apk \
            --title "The Rut (latest test build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download the-rut.apk on an Android phone and open it to install." \
            --prerelease
